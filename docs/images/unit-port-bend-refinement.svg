<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<title>Actual cassette port route geometry before and after terminal refinement</title>
<desc>Same real cassette socket fixture and 700 mm guide departure, bend factor 1. Before geometry was reconstructed in an offline harness by restoring the previous curve stitching and repeated rounding. After geometry is emitted by the current production builder. Stroke widths are simplified; these are saved XY centerlines, not an installation drawing.</desc>
<rect width="1600" height="950" fill="#f4f7fb"/>
<text x="42" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="#15263c">Cassette connection: removing the small loops</text>
<text x="42" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5d718a">Same equipment ports, route guide and bend setting. The downstream 90° elbow stays on its lane.</text>
